# Copy to config.ini (not committed) and adjust. Paths are for Home Assistant OS; see README.

[battery]
# your dongle under /dev/serial/by-id/ (this one is a typical CH340 adapter)
device = /dev/serial/by-id/usb-1a86_USB_Serial-if00-port0
baud = 115200
address = 2
timeout = 2
retries = 3

[history]
# rolling cell history used for the 7-day statistics
file = /config/scripts/pylontech/history.json
window_days = 7

[mqtt]
# on HA OS the Mosquitto add-on is reachable as core-mosquitto
host = core-mosquitto
port = 1883
username = pylontech
# file containing only the password (chmod 600); never put the password in this file
password_file = /config/scripts/pylontech/mqtt.pw
client_id = pylontech-ha
base_topic = pylontech
discovery_prefix = homeassistant

[homeassistant]
device_name = Pylontech
# prefix of unique ids + discovery topics; change only for a second battery
unique_id_prefix = pylontech
# optional: identifier of a parent device (e.g. the host the dongle is plugged into)
via_device =
# seconds without an update before entities become unavailable (3 missed 10-min runs)
expire_after = 1800
